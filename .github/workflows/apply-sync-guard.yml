name: Apply sync guard

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync downloads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/core/network/sync_service.dart')
          s=p.read_text()
          if '_remoteCanReplace(' not in s:
            marker='  Future<void> syncClients() async {'
            helper="""  bool _remoteCanReplace(Map<String, dynamic> local, Map<String, dynamic> remote) {
    if ((local['is_synced'] as num?)?.toInt() == 0) return false;
    final localUpdated = DateTime.tryParse(local['updated_at']?.toString() ?? '');
    final remoteUpdated = DateTime.tryParse(remote['updated_at']?.toString() ?? '');
    if (remoteUpdated == null) return false;
    if (localUpdated == null) return true;
    return !remoteUpdated.isBefore(localUpdated);
  }

"""
            if marker not in s: raise SystemExit('marker not found')
            s=s.replace(marker,helper+marker,1)
          old="""        if (existing.isEmpty) {
          await db.insert(tableName, data);
        } else {
          await db.update(
            tableName,
            data,
            where: 'sync_id = ?',
            whereArgs: [syncId],
          );
        }"""
          new="""        if (existing.isEmpty) {
          await db.insert(tableName, data);
        } else if (_remoteCanReplace(existing.first, data)) {
          await db.update(
            tableName,
            data,
            where: 'sync_id = ?',
            whereArgs: [syncId],
          );
        }"""
          s=s.replace(old,new)
          for table in ['clients','tanks','filling_operations','sales','payments','salaries','expenses']:
            old=f"""        if (existing.isEmpty) {{
          await db.insert('{table}', data);
        }} else {{
          await db.update(
            '{table}',
            data,
            where: 'sync_id = ?',
            whereArgs: [syncId],
          );
        }}"""
            new=f"""        if (existing.isEmpty) {{
          await db.insert('{table}', data);
        }} else if (_remoteCanReplace(existing.first, data)) {{
          await db.update(
            '{table}',
            data,
            where: 'sync_id = ?',
            whereArgs: [syncId],
          );
        }}"""
            s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/network/sync_service.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Protect local changes from stale sync downloads'
          git push origin main
