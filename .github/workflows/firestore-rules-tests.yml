name: Firestore Rules Tests

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore_rules_tests/**'
      - '.github/workflows/firestore-rules-tests.yml'
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore_rules_tests/**'
      - '.github/workflows/firestore-rules-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore_rules_tests/package.json

      - name: Install test dependencies
        working-directory: firestore_rules_tests
        run: npm install --no-audit --no-fund

      - name: Test Firestore rules in emulator
        working-directory: firestore_rules_tests
        run: npx firebase emulators:exec --project demo-alborai-water-tank --only firestore "npm test"
