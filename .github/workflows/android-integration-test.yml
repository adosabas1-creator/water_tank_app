name: Android Integration Tests

on:
  workflow_dispatch:

jobs:
  android-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: flutter pub get

      - name: Start Firebase Emulators
        run: |
          firebase emulators:start --only auth,firestore > firebase-emulator.log 2>&1 &
          echo $! > firebase-emulator.pid

          for i in {1..60}; do
            if curl -sf http://127.0.0.1:4000/ > /dev/null; then
              echo "Firebase Emulators are ready"
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "Firebase Emulators failed to start"
              cat firebase-emulator.log
              exit 1
            fi

            sleep 2
          done

      - name: Create emulator test user
        id: emulator-user
        run: |
          RESPONSE=$(curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"sync-test@example.com","password":"test123456","returnSecureToken":true}' \
            'http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signUp?key=fake-api-key')

          echo "$RESPONSE"

          TEST_UID=$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["localId"])')

          echo "uid=$TEST_UID" >> "$GITHUB_OUTPUT"

      - name: Seed emulator user directory
        env:
          TEST_UID: ${{ steps.emulator-user.outputs.uid }}
        run: |
          cat > /tmp/user-directory.json <<EOF
          {
            "fields": {
              "sync_id": {"stringValue": "sync-test-user"},
              "firebase_uid": {"stringValue": "$TEST_UID"},
              "firebase_email": {"stringValue": "sync-test@example.com"},
              "username": {"stringValue": "sync_test_admin"},
              "full_name": {"stringValue": "Sync Test Admin"},
              "role": {"stringValue": "admin"},
              "permissions": {
                "mapValue": {
                  "fields": {
                    "clients_view": {"booleanValue": true},
                    "clients_add": {"booleanValue": true},
                    "clients_edit": {"booleanValue": true},
                    "clients_delete": {"booleanValue": true}
                  }
                }
              },
              "is_deleted": {"booleanValue": false}
            }
          }
          EOF

          curl -sS -X PATCH \
            -H 'Authorization: Bearer owner' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/user-directory.json \
            "http://127.0.0.1:8080/v1/projects/alborai-water-tank/databases/(default)/documents/businesses/alborai_water_tank/user_directory/$TEST_UID"

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            flutter test integration_test/sync_service_test.dart \
              -d emulator-5554 \
              --dart-define=SYNC_TEST_UID=${{ steps.emulator-user.outputs.uid }} \
              --dart-define=FIREBASE_EMULATOR_HOST=10.0.2.2

      - name: Stop Firebase Emulators
        if: always()
        run: |
          if [ -f firebase-emulator.pid ]; then
            kill "$(cat firebase-emulator.pid)" || true
          fi

      - name: Upload Firebase Emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-firebase-emulator-log
          path: firebase-emulator.log
          if-no-files-found: ignore
