workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create android folder
        script: |
          rm -rf android
          flutter create --platforms=android .
          echo "✅ Android folder created"
          echo "📄 Showing build.gradle content (first 30 lines):"
          head -30 android/app/build.gradle || echo "File not found!"

      - name: Fix compileSdk
        script: |
          echo "📝 Fixing compileSdk..."
          # محاولة تعديل الصيغة Groovy
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' android/app/build.gradle
          # محاولة تعديل الصيغة Kotlin (إن وجدت)
          sed -i 's/compileSdk = [0-9]*/compileSdk = 34/g' android/app/build.gradle.kts || true
          # إضافة السطر إن لم يكن موجوداً
          if ! grep -q "compileSdkVersion 34" android/app/build.gradle; then
            sed -i '/android {/a \ \ \ \ compileSdkVersion 34' android/app/build.gradle
          fi
          echo "✅ compileSdk set to 34"
          grep -n "compileSdk" android/app/build.gradle || echo "⚠️ No compileSdk line found!"

      - name: Fix minSdk
        script: |
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle
          echo "✅ minSdk set to 21"

      - name: Get packages
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your_email@example.com
