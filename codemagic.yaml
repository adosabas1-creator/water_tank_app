workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: linux
    environment:
      flutter: stable
    scripts:
      - name: Setup Java 17
        script: |
          apt-get update && apt-get install -y openjdk-17-jdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
          echo "JAVA_HOME set to $JAVA_HOME"
          java -version

      - name: Create Android folder structure
        script: |
          rm -rf android
          mkdir -p android/app/src/main/kotlin/com/example/water_tank_app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/gradle/wrapper
          echo "✅ Folder structure created"

      - name: Write AndroidManifest.xml (v2)
        script: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOL'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.water_tank_app">
              <application
                  android:label="water_tank_app"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOL

      - name: Write MainActivity.kt
        script: |
          cat > android/app/src/main/kotlin/com/example/water_tank_app/MainActivity.kt << 'EOL'
          package com.example.water_tank_app
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOL

      - name: Write styles.xml and launch_background
        script: |
          cat > android/app/src/main/res/values/styles.xml << 'EOL'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOL
          cat > android/app/src/main/res/drawable/launch_background.xml << 'EOL'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
          </layer-list>
          EOL

      - name: Write build.gradle (project) with AGP 8.1.0
        script: |
          cat > android/build.gradle << 'EOL'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOL

      - name: Write app/build.gradle (v2)
        script: |
          cat > android/app/build.gradle << 'EOL'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
              id 'dev.flutter.flutter-gradle-plugin'
          }

          def localProperties = new Properties()
          def localPropertiesFile = rootProject.file('local.properties')
          if (localPropertiesFile.exists()) {
              localPropertiesFile.withReader('UTF-8') { reader ->
                  localProperties.load(reader)
              }
          }

          def flutterRoot = localProperties.getProperty('flutter.sdk')
          if (flutterRoot == null) {
              throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
          }

          android {
              compileSdkVersion 34
              ndkVersion "23.1.7779620"
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              defaultConfig {
                  applicationId "com.example.water_tank_app"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }

          flutter {
              source '../..'
          }
          EOL

      - name: Write settings.gradle with pluginManagement
        script: |
          cat > android/settings.gradle << 'EOL'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
          }
          include ":app"
          EOL

      - name: Write local.properties
        script: |
          cat > android/local.properties << 'EOL'
          sdk.dir=/usr/local/android-sdk
          flutter.sdk=/usr/local/flutter
          EOL

      - name: Write gradle.properties
        script: |
          cat > android/gradle.properties << 'EOL'
          org.gradle.jvmargs=-Xmx4g
          android.useAndroidX=true
          android.enableJetifier=true
          EOL

      - name: Write gradle-wrapper.properties with Gradle 8.4
        script: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOL'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOL

      - name: Get packages
        script: flutter pub get

      - name: Build APK
        script: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your_email@example.com
