workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60

    environment:
      flutter: stable
      android_signing:
        - water_tank_key

    scripts:
      - name: Check Flutter and Java
        script: |
          flutter --version
          java -version

      - name: Get packages
        script: |
          flutter pub get

      - name: Build signed APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
