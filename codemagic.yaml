workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create android folder (Groovy DSL)
        script: |
          rm -rf android
          flutter create --platforms=android --android-language=java .
          echo "✅ Android folder created with Groovy DSL"

      - name: Fix compileSdk and minSdk
        script: |
          # تعديل compileSdkVersion إلى 34
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' android/app/build.gradle
          # تعديل minSdkVersion إلى 21
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle
          # إضافة targetSdkVersion 34 (إن لم توجد)
          if ! grep -q "targetSdkVersion" android/app/build.gradle; then
            sed -i '/defaultConfig {/a \ \ \ \ \ \ \ \ targetSdkVersion 34' android/app/build.gradle
          else
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' android/app/build.gradle
          fi
          echo "✅ compileSdk=34, minSdk=21, targetSdk=34"
          echo "📄 First 20 lines of build.gradle:"
          head -20 android/app/build.gradle

      - name: Get packages
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your_email@example.com
