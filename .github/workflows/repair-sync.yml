name: Repair sync service

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair sync service safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/core/network/sync_service.dart')
          s = p.read_text()
          helper = '''\n  bool _remoteCanReplace(Map<String, dynamic> local, Map<String, dynamic> remote) {\n    if ((local['is_synced'] as num?)?.toInt() == 0) return false;\n    final l = DateTime.tryParse(local['updated_at']?.toString() ?? '');\n    final r = DateTime.tryParse(remote['updated_at']?.toString() ?? '');\n    if (r == null) return false;\n    if (l == null) return true;\n    return !r.isBefore(l);\n  }\n'''
          if '_remoteCanReplace(' not in s:
              marker = '  Future<void> syncClients() async {'
              if marker not in s: raise SystemExit('sync marker missing')
              s = s.replace(marker, helper + '\n' + marker, 1)

          # Protect every generic existing-record download update. This intentionally
          # leaves inserts unchanged and only prevents a remote stale record from
          # overwriting an unsynced/newer local record.
          old = '''        if (existing.isEmpty) {\n          await db.insert(tableName, data);\n        } else {\n          await db.update(\n            tableName,\n            data,\n            where: 'sync_id = ?',\n            whereArgs: [syncId],\n          );\n        }'''
          new = '''        if (existing.isEmpty) {\n          await db.insert(tableName, data);\n        } else if (_remoteCanReplace(existing.first, data)) {\n          await db.update(\n            tableName,\n            data,\n            where: 'sync_id = ?',\n            whereArgs: [syncId],\n          );\n        }'''
          if old in s: s = s.replace(old, new)

          # Protect specialized download updates with the same rule.
          for table in ['clients','tanks','filling_operations','sales','payments','salaries','expenses']:
              old = f'''        if (existing.isEmpty) {{\n          await db.insert('{table}', data);\n        }} else {{\n          await db.update(\n            '{table}',\n            data,\n            where: 'sync_id = ?',\n            whereArgs: [syncId],\n          );\n        }}'''
              new = f'''        if (existing.isEmpty) {{\n          await db.insert('{table}', data);\n        }} else if (_remoteCanReplace(existing.first, data)) {{\n          await db.update(\n            '{table}',\n            data,\n            where: 'sync_id = ?',\n            whereArgs: [syncId],\n          );\n        }}'''
              if old in s: s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/network/sync_service.dart
          git diff --cached --quiet && exit 0
          git commit -m "Prevent stale remote sync overwrites"
          git push origin HEAD:main
