workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create android folder
        script: |
          rm -rf android
          flutter create --platforms=android .
          echo "✅ Android folder created"

      - name: Fix compileSdk and minSdk
        script: |
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle.kts || true
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle.kts || true
          echo "✅ compileSdk=34, minSdk=21"

      - name: Get packages
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - your_email@example.com
