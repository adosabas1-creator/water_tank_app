name: Android Integration Tests

on:
  workflow_dispatch:

jobs:
  android-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          cache: true

      - name: Allow cleartext traffic for emulator tests only
        run: |
          mkdir -p android/app/src/debug
          cat > android/app/src/debug/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:usesCleartextTraffic="true" />
          </manifest>
          XML

      - name: Create test-only Google Services config
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "alborai-water-tank",
              "storage_bucket": "alborai-water-tank.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.alborai.water_tank_app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "fake-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: flutter pub get

      - name: Start Firebase Emulators
        run: |
          sed -i 's/"host": "127.0.0.1"/"host": "0.0.0.0"/g' firebase.json
          firebase emulators:start --project alborai-water-tank --only auth,firestore > firebase-emulator.log 2>&1 &
          echo $! > firebase-emulator.pid

          for i in {1..90}; do
            if curl -sS --max-time 2 -o /dev/null http://127.0.0.1:9099/ &&
               curl -sS --max-time 2 -o /dev/null http://127.0.0.1:8080/; then
              echo "Firebase Auth and Firestore emulators are reachable"
              break
            fi

            if [ "$i" -eq 90 ]; then
              echo "Firebase Auth or Firestore emulator failed to start"
              cat firebase-emulator.log
              exit 1
            fi

            sleep 2
          done

      - name: Create emulator test user
        id: emulator-user
        run: |
          RESPONSE=$(curl --fail-with-body -sS -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"sync-test@example.com","password":"test123456","returnSecureToken":true}' \
            'http://127.0.0.1:9099/identitytoolkit.googleapis.com/v1/accounts:signUp?key=fake-api-key')

          echo "$RESPONSE"

          TEST_UID=$(echo "$RESPONSE" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          uid = data.get("localId")
          if not isinstance(uid, str) or not uid.strip():
              raise SystemExit("Firebase Auth response has no valid localId")
          print(uid)
          ')

          echo "uid=$TEST_UID" >> "$GITHUB_OUTPUT"

      - name: Seed emulator user directory
        env:
          TEST_UID: ${{ steps.emulator-user.outputs.uid }}
        run: |
          cat > /tmp/user-directory.json <<EOF
          {
            "fields": {
              "sync_id": {"stringValue": "sync-test-user"},
              "firebase_uid": {"stringValue": "$TEST_UID"},
              "firebase_email": {"stringValue": "sync-test@example.com"},
              "username": {"stringValue": "sync_test_admin"},
              "full_name": {"stringValue": "Sync Test Admin"},
              "role": {"stringValue": "admin"},
              "permissions": {
                "mapValue": {
                  "fields": {
                    "clients_view": {"booleanValue": true},
                    "clients_add": {"booleanValue": true},
                    "clients_edit": {"booleanValue": true},
                    "clients_delete": {"booleanValue": true}
                  }
                }
              },
              "is_deleted": {"booleanValue": false}
            }
          }
          EOF

          curl --fail-with-body -sS -X PATCH \
            -H 'Authorization: Bearer owner' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/user-directory.json \
            "http://127.0.0.1:8080/v1/projects/alborai-water-tank/databases/(default)/documents/businesses/alborai_water_tank/user_directory/$TEST_UID"

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            adb wait-for-device
            adb reverse tcp:9099 tcp:9099
            adb reverse tcp:8080 tcp:8080
            unset CI
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/sync_service_test.dart -d emulator-5554 --dart-define=SYNC_TEST_UID=${{ steps.emulator-user.outputs.uid }} --dart-define=FIREBASE_EMULATOR_HOST=10.0.2.2

      - name: Stop Firebase Emulators
        if: always()
        run: |
          if [ -f firebase-emulator.pid ]; then
            kill "$(cat firebase-emulator.pid)" || true
          fi

      - name: Upload Firebase Emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-firebase-emulator-log
          path: firebase-emulator.log
          if-no-files-found: ignore
