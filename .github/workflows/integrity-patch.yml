name: Integrity patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch database integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/core/database/database_helper.dart')
          s = p.read_text()
          marker = "      version: AppConstants.localDbVersion,\n"
          addition = marker + "      onConfigure: (db) async {\n        await db.execute('PRAGMA foreign_keys = ON');\n      },\n"
          if 'PRAGMA foreign_keys = ON' not in s:
              if marker not in s:
                  raise SystemExit('marker not found')
              p.write_text(s.replace(marker, addition, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/database/database_helper.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enforce SQLite foreign keys"
          git push origin main
