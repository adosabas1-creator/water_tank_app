name: Release Baseline Evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests and coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Configure Firebase Android file
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || { echo "Missing GOOGLE_SERVICES_JSON secret"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Configure release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p android/app/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/water_tank_release.keystore
          test -s android/app/keystore/water_tank_release.keystore

      - name: Build release APK
        env:
          CM_KEYSTORE_PATH: keystore/water_tank_release.keystore
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$CM_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$CM_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$CM_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --obfuscate --split-debug-info=build/debug-info

      - name: Verify APK signature and record SHA-256
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee build/app-release.sha256
          "$ANDROID_HOME/platform-tools/adb" version || true

      - name: Upload signed release APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app-release.sha256
          if-no-files-found: error

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: release-debug-symbols
          path: build/debug-info/
          if-no-files-found: error
